<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="architecture-diagram-title architecture-diagram-desc">
<title id="architecture-diagram-title">Orbit logical architecture</title><desc id="architecture-diagram-desc">Next.js public site, agency workspace and client portal connect to server routes and services, then Payload CMS and authentication. The backend connects to PostgreSQL and storage or email services. Logical system diagram, not a deployment topology.</desc>
<style>:root{--night:#101326;--raised:#171B33;--well:#1F2440;--cloud:#F8FAFC;--paper:#F1EEF8;--soft:#E6E1F4;--lavender:#C4B5FD;--violet:#8B5CF6;--accent:#7C3AED;--muted:#5B6478;--muted-dark:#9CA3BF;--rule:#DDD8EC;--rule-dark:#2A2F4A;--arc:#4A4470;--white:#FFFFFF;--display:Outfit,'Trebuchet MS',sans-serif;--body:Onest,Arial,sans-serif;--code:'JetBrains Mono',Consolas,monospace}
text{font-family:var(--body);fill:var(--night);font-size:16px} .head,.button{font-family:var(--display);font-weight:500;letter-spacing:-.03em}.muted{fill:var(--muted)}.light{fill:var(--cloud)}.lavender{fill:var(--lavender)}.night-muted{fill:var(--muted-dark)}.mono{font-family:var(--code)}
@font-face{font-family:'Onest';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Outfit';font-style:normal;font-weight:500;src:url(data:font/woff;base64,) format('woff')}</style><defs><clipPath id="architecture-diagram-clip"><rect width="1200" height="820" rx="16"/></clipPath></defs>
<g clip-path="url(#architecture-diagram-clip)"><rect x="0" y="0" width="1200" height="820" rx="16" fill="var(--night)"/><text x="40" y="60" class="head" style="font-size:34px;fill:var(--cloud)">how orbit fits together</text><text x="40" y="96" class="" style="font-size:16px;fill:var(--muted-dark)">Logical architecture</text><rect x="40" y="140" width="340" height="110" rx="16" fill="var(--raised)"/><text x="64" y="184" class="head" style="font-size:24px;fill:var(--cloud)">public site</text><text x="64" y="218" class="" style="font-size:16px;fill:var(--lavender)">Next.js</text><rect x="430" y="140" width="340" height="110" rx="16" fill="var(--raised)"/><text x="454" y="184" class="head" style="font-size:24px;fill:var(--cloud)">agency workspace</text><text x="454" y="218" class="" style="font-size:16px;fill:var(--lavender)">/app</text><rect x="820" y="140" width="340" height="110" rx="16" fill="var(--raised)"/><text x="844" y="184" class="head" style="font-size:24px;fill:var(--cloud)">client portal</text><text x="844" y="218" class="" style="font-size:16px;fill:var(--lavender)">/portal</text><g fill="none" stroke="var(--arc)" stroke-width="1.5"><path d="M210 250V290H600V330M600 250V330M990 250V290H600"/><path d="M600 440V480M600 590V630H210V670M600 630H990V670"/></g><rect x="310" y="330" width="580" height="110" rx="16" fill="var(--well)"/><text x="340" y="375" class="head" style="font-size:28px;fill:var(--cloud)">server routes + services</text><text x="340" y="409" class="" style="font-size:16px;fill:var(--lavender)">Permissions, approvals, invoice rules</text><rect x="310" y="480" width="580" height="110" rx="16" fill="var(--raised)"/><text x="340" y="525" class="head" style="font-size:28px;fill:var(--cloud)">Payload CMS &amp; auth</text><text x="340" y="559" class="" style="font-size:16px;fill:var(--lavender)">Content, identity and tenant access</text><rect x="40" y="670" width="340" height="110" rx="16" fill="var(--raised)"/><text x="64" y="714" class="head" style="font-size:24px;fill:var(--cloud)">PostgreSQL</text><text x="64" y="748" class="" style="font-size:16px;fill:var(--lavender)">Records and relationships</text><rect x="820" y="670" width="340" height="110" rx="16" fill="var(--raised)"/><text x="844" y="714" class="head" style="font-size:24px;fill:var(--cloud)">storage / email</text><text x="844" y="748" class="" style="font-size:16px;fill:var(--lavender)">Files and notifications</text></g></svg>