<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="hero-sync-arc-title hero-sync-arc-desc">
<title id="hero-sync-arc-title">One approval, two views</title><desc id="hero-sync-arc-desc">A single orbit arc joins the portal approval to the agency board. The lavender dot rests at the agency endpoint; static reduced-motion-safe artwork.</desc>
<style>:root{--night:#101326;--raised:#171B33;--well:#1F2440;--cloud:#F8FAFC;--paper:#F1EEF8;--soft:#E6E1F4;--lavender:#C4B5FD;--violet:#8B5CF6;--accent:#7C3AED;--muted:#5B6478;--muted-dark:#9CA3BF;--rule:#DDD8EC;--rule-dark:#2A2F4A;--arc:#4A4470;--white:#FFFFFF;--display:Outfit,'Trebuchet MS',sans-serif;--body:Onest,Arial,sans-serif;--code:'JetBrains Mono',Consolas,monospace}
text{font-family:var(--body);fill:var(--night);font-size:16px} .head,.button{font-family:var(--display);font-weight:500;letter-spacing:-.03em}.muted{fill:var(--muted)}.light{fill:var(--cloud)}.lavender{fill:var(--lavender)}.night-muted{fill:var(--muted-dark)}.mono{font-family:var(--code)}
</style><defs><clipPath id="hero-sync-arc-clip"><rect width="600" height="360" rx="16"/></clipPath></defs>
<g clip-path="url(#hero-sync-arc-clip)"><path id="sync-arc" d="M480 302C72 338 60 64 290 48" fill="none" stroke="var(--arc)" stroke-width="1"/><circle id="sync-dot" cx="290" cy="48" r="5" fill="var(--lavender)"/></g></svg>