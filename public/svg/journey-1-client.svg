<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="journey-1-client-title journey-1-client-desc">
<title id="journey-1-client-title">Add the client</title><desc id="journey-1-client-desc">Sample Atlas client record at Northstar Studio. Morgan is the approval contact. Scope: brand identity and final files. Portal access is on.</desc>
<style>:root{--night:#101326;--raised:#171B33;--well:#1F2440;--cloud:#F8FAFC;--paper:#F1EEF8;--soft:#E6E1F4;--lavender:#C4B5FD;--violet:#8B5CF6;--accent:#7C3AED;--muted:#5B6478;--muted-dark:#9CA3BF;--rule:#DDD8EC;--rule-dark:#2A2F4A;--arc:#4A4470;--white:#FFFFFF;--display:Outfit,'Trebuchet MS',sans-serif;--body:Onest,Arial,sans-serif;--code:'JetBrains Mono',Consolas,monospace}
text{font-family:var(--body);fill:var(--night);font-size:16px} .head,.button{font-family:var(--display);font-weight:500;letter-spacing:-.03em}.muted{fill:var(--muted)}.light{fill:var(--cloud)}.lavender{fill:var(--lavender)}.night-muted{fill:var(--muted-dark)}.mono{font-family:var(--code)}
@font-face{font-family:'Onest';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Outfit';font-style:normal;font-weight:500;src:url(data:font/woff;base64,) format('woff')}</style><defs><clipPath id="journey-1-client-clip"><rect width="800" height="560" rx="16"/></clipPath></defs>
<g clip-path="url(#journey-1-client-clip)"><rect x="0" y="0" width="800" height="560" rx="16" fill="var(--cloud)"/><text x="32" y="38" class="muted" style="font-size:14px">Northstar Studio / Atlas</text><text x="32" y="86" class="head" style="font-size:32px">atlas</text><rect x="646" y="20" width="122" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="707.0" y="41" class="button" style="font-size:14px;fill:var(--night)">sample data</text><path d="M32 110H768" fill="none" stroke="var(--rule)"/><text x="32" y="156" class="muted" style="font-size:16px">Client</text><text x="252" y="156" class="" style="font-size:16px">Atlas</text><path d="M32 178H768" fill="none" stroke="var(--rule)"/><text x="32" y="220" class="muted" style="font-size:16px">Primary contact</text><text x="252" y="220" class="" style="font-size:16px">Morgan / signs off</text><path d="M32 242H768" fill="none" stroke="var(--rule)"/><text x="32" y="284" class="muted" style="font-size:16px">Scope</text><text x="252" y="284" class="" style="font-size:16px">Brand identity and final files</text><path d="M32 306H768" fill="none" stroke="var(--rule)"/><text x="32" y="350" class="head" style="font-size:22px">portal access</text><text x="32" y="385" class="muted" style="font-size:16px">Morgan can review shared deliverables.</text><rect x="664" y="338" width="72" height="40" rx="20" fill="var(--accent)"/><circle cx="716" cy="358" r="14" fill="var(--white)"/><text x="684" y="408" class="" style="font-size:16px">On</text><text x="32" y="464" class="muted" style="font-size:16px">Linked project</text><text x="252" y="464" class="" style="font-size:16px">Atlas Brand Identity</text><path d="M32 486H768" fill="none" stroke="var(--rule)"/><path d="M32 508H768" fill="none" stroke="var(--rule)"/><text x="32" y="536" class="muted" style="font-size:14px">Northstar Studio is fictional. Sample data.</text></g></svg>