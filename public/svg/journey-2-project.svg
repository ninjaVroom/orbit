"/><text text-anchor="middle" x="285.0" y="470" class="button" style="font-size:14px;fill:var(--night)">Taylor</text><rect x="388" y="449" width="150" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="463.0" y="470" class="button" style="font-size:14px;fill:var(--night)">Jamie</text><rect x="566" y="449" width="150" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="641.0" y="470" class="button" style="font-size:14px;fill:var(--night)">Riley</text><path d="M32 508H768" fill="none" stroke="var(--rule)"/><text x="32" y="536" class="muted" style="font-size:14px">Northstar Studio is fictional. Sample data.</text></g></svg>