<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="journey-3-board-title journey-3-board-desc">
<title id="journey-3-board-title">Do the work</title><desc id="journey-3-board-desc">Sample Kanban execution. Final presentation v3 has moved from in progress to client review; Jamie’s move is recorded in the activity log.</desc>
<style>:root{--night:#101326;--raised:#171B33;--well:#1F2440;--cloud:#F8FAFC;--paper:#F1EEF8;--soft:#E6E1F4;--lavender:#C4B5FD;--violet:#8B5CF6;--accent:#7C3AED;--muted:#5B6478;--muted-dark:#9CA3BF;--rule:#DDD8EC;--rule-dark:#2A2F4A;--arc:#4A4470;--white:#FFFFFF;--display:Outfit,'Trebuchet MS',sans-serif;--body:Onest,Arial,sans-serif;--code:'JetBrains Mono',Consolas,monospace}
text{font-family:var(--body);fill:var(--night);font-size:16px} .head,.button{font-family:var(--display);font-weight:500;letter-spacing:-.03em}.muted{fill:var(--muted)}.light{fill:var(--cloud)}.lavender{fill:var(--lavender)}.night-muted{fill:var(--muted-dark)}.mono{font-family:var(--code)}
@font-face{font-family:'Onest';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Outfit';font-style:normal;font-weight:500;src:url(data:font/woff;base64,) format('woff')}</style><defs><clipPath id="journey-3-board-clip"><rect width="800" height="560" rx="16"/></clipPath></defs>
<g clip-path="url(#journey-3-board-clip)"><rect x="0" y="0" width="800" height="560" rx="16" fill="var(--cloud)"/><text x="32" y="38" class="muted" style="font-size:14px">Northstar Studio / Atlas</text><text x="32" y="86" class="head" style="font-size:32px">the work, ready to review</text><rect x="646" y="20" width="122" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="707.0" y="41" class="button" style="font-size:14px;fill:var(--night)">sample data</text><path d="M32 110H768" fill="none" stroke="var(--rule)"/><text x="32" y="154" class="head" style="font-size:20px">in progress</text><text x="300" y="154" class="head" style="font-size:20px">client review</text><text x="568" y="154" class="head" style="font-size:20px">done</text><rect x="32" y="180" width="236" height="138" rx="16" fill="var(--paper)"/><text x="52" y="214" class="head" style="font-size:18px">Export guidelines</text><text x="52" y="245" class="muted" style="font-size:16px">Riley</text><rect x="52" y="268" width="76" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="90.0" y="289" class="button" style="font-size:14px;fill:var(--night)">medium</text><rect x="300" y="180" width="236" height="138" rx="16" fill="var(--paper)"/><text x="320" y="214" class="head" style="font-size:18px">Final presentation v3</text><text x="320" y="245" class="muted" style="font-size:16px">Jamie</text><rect x="320" y="268" width="156" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="398.0" y="289" class="button" style="font-size:14px;fill:var(--night)">ready for review</text><rect x="568" y="180" width="200" height="138" rx="16" fill="var(--paper)"/><text x="588" y="214" class="head" style="font-size:18px">Brand direction</text><text x="588" y="245" class="muted" style="font-size:16px">Taylor</text><rect x="588" y="268" width="92" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="634.0" y="289" class="button" style="font-size:14px;fill:var(--night)">approved</text><text x="32" y="379" class="head" style="font-size:22px">activity</text><path d="M32 400H768" fill="none" stroke="var(--rule)"/><text x="32" y="434" class="" style="font-size:16px">Jamie moved Final presentation v3 to client review.</text><text x="32" y="467" class="muted" style="font-size:14px">09 Nov 2026, 09:24 UTC</text><path d="M32 508H768" fill="none" stroke="var(--rule)"/><text x="32" y="536" class="muted" style="font-size:14px">Northstar Studio is fictional. Sample data.</text></g></svg>