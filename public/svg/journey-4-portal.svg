<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="journey-4-portal-title journey-4-portal-desc">
<title id="journey-4-portal-title">Hand it over</title><desc id="journey-4-portal-desc">Sample Morgan portal review of Final presentation v3. Approve and ask for changes are illustrated controls. The version history preserves Morgan’s changes request on v2 at 14:32 UTC on 6 November 2026.</desc>
<style>:root{--night:#101326;--raised:#171B33;--well:#1F2440;--cloud:#F8FAFC;--paper:#F1EEF8;--soft:#E6E1F4;--lavender:#C4B5FD;--violet:#8B5CF6;--accent:#7C3AED;--muted:#5B6478;--muted-dark:#9CA3BF;--rule:#DDD8EC;--rule-dark:#2A2F4A;--arc:#4A4470;--white:#FFFFFF;--display:Outfit,'Trebuchet MS',sans-serif;--body:Onest,Arial,sans-serif;--code:'JetBrains Mono',Consolas,monospace}
text{font-family:var(--body);fill:var(--night);font-size:16px} .head,.button{font-family:var(--display);font-weight:500;letter-spacing:-.03em}.muted{fill:var(--muted)}.light{fill:var(--cloud)}.lavender{fill:var(--lavender)}.night-muted{fill:var(--muted-dark)}.mono{font-family:var(--code)}
@font-face{font-family:'Onest';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Outfit';font-style:normal;font-weight:500;src:url(data:font/woff;base64,) format('woff')}</style><defs><clipPath id="journey-4-portal-clip"><rect width="800" height="580" rx="16"/></clipPath></defs>
<g clip-path="url(#journey-4-portal-clip)"><rect x="0" y="0" width="800" height="580" rx="16" fill="var(--cloud)"/><text x="32" y="38" class="muted" style="font-size:14px">Northstar Studio / Morgan’s portal</text><text x="32" y="86" class="head" style="font-size:32px">ready for your review</text><rect x="646" y="20" width="122" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="707.0" y="41" class="button" style="font-size:14px;fill:var(--night)">sample data</text><path d="M32 110H768" fill="none" stroke="var(--rule)"/><text x="32" y="160" class="head" style="font-size:28px">Final presentation v3</text><rect x="684" y="134" width="64" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="716.0" y="155" class="button" style="font-size:14px;fill:var(--night)">v3</text><rect x="32" y="190" width="736" height="150" rx="16" fill="var(--night)"/><text x="60" y="248" class="head" style="font-size:44px;fill:var(--cloud)">atlas</text><text x="60" y="295" class="" style="font-size:18px;fill:var(--lavender)">Brand identity / final presentation</text><rect x="32" y="364" width="154" height="48" rx="24" fill="var(--accent)"/><text text-anchor="middle" x="109.0" y="394" class="button" style="font-size:16px;fill:var(--white)">approve</text><rect x="206" y="372" width="174" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="293.0" y="393" class="button" style="font-size:14px;fill:var(--night)">ask for changes</text><path d="M32 432H768" fill="none" stroke="var(--rule)"/><text x="32" y="466" class="" style="font-size:16px">Previous decision: Morgan requested changes on v2.</text><text x="32" y="493" class="muted" style="font-size:14px">06 Nov 2026, 14:32 UTC</text><path d="M32 528H768" fill="none" stroke="var(--rule)"/><text x="32" y="556" class="muted" style="font-size:14px">Northstar Studio is fictional. Sample data.</text></g></svg>