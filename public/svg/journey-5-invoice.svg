var(--white)">paid</text><path d="M212 444H282" fill="none" stroke="var(--rule)"/><path d="M462 444H532" fill="none" stroke="var(--rule)"/><text x="32" y="493" class="muted" style="font-size:14px">09 Nov</text><text x="282" y="493" class="muted" style="font-size:14px">10 Nov</text><text x="532" y="493" class="muted" style="font-size:14px">12 Nov 2026</text><path d="M32 518H768" fill="none" stroke="var(--rule)"/><text x="32" y="546" class="muted" style="font-size:14px">Northstar Studio is fictional. Sample data.</text></g></svg>