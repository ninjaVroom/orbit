<svg xmlns="http://www.w3.org/2000/svg" width="204" height="64" viewBox="0 0 204 64" role="img" aria-labelledby="logo-dark-title logo-dark-desc">
<title id="logo-dark-title">orbit.</title><desc id="logo-dark-desc">Orbit wordmark with concentric orbital rings and a violet satellite dot.</desc>
<style>:root{--night:#101326;--raised:#171B33;--well:#1F2440;--cloud:#F8FAFC;--paper:#F1EEF8;--soft:#E6E1F4;--lavender:#C4B5FD;--violet:#8B5CF6;--accent:#7C3AED;--muted:#5B6478;--muted-dark:#9CA3BF;--rule:#DDD8EC;--rule-dark:#2A2F4A;--arc:#4A4470;--white:#FFFFFF;--display:Outfit,'Trebuchet MS',sans-serif;--body:Onest,Arial,sans-serif;--code:'JetBrains Mono',Consolas,monospace}
text{font-family:var(--body);fill:var(--night);font-size:16px} .head,.button{font-family:var(--display);font-weight:500;letter-spacing:-.03em}.muted{fill:var(--muted)}.light{fill:var(--cloud)}.lavender{fill:var(--lavender)}.night-muted{fill:var(--muted-dark)}.mono{font-family:var(--code)}
@font-face{font-family:'Onest';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Outfit';font-style:normal;font-weight:500;src:url(data:font/woff;base64,) format('woff')}</style><defs><clipPath id="logo-dark-clip"><rect width="204" height="64" rx="16"/></clipPath></defs>
<g clip-path="url(#logo-dark-clip)"><g transform="translate(4 12) scale(1)" fill="none" stroke="var(--lavender)" stroke-width="1.5"><circle cx="20" cy="20" r="17"/><circle cx="20" cy="20" r="10"/><circle cx="34" cy="10" r="4" fill="var(--violet)" stroke="none"/></g><text x="56" y="48" class="head" style="font-size:48px;fill:var(--cloud)">orbit.</text></g></svg>