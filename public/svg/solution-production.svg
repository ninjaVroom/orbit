<svg xmlns="http://www.w3.org/2000/svg" width="600" height="856" viewBox="0 0 600 856" role="img" aria-labelledby="solution-production-title solution-production-desc">
<title id="solution-production-title">Orbit for production: Echo</title><desc id="solution-production-desc">Fictional Echo brand film handover. Final cut v5 is ready for review. Three stages: Edit notes resolved; Master export ready; Approve the final cut. Static sample UI.</desc>
<style>:root{--night:#101326;--raised:#171B33;--well:#1F2440;--cloud:#F8FAFC;--paper:#F1EEF8;--soft:#E6E1F4;--lavender:#C4B5FD;--violet:#8B5CF6;--accent:#7C3AED;--muted:#5B6478;--muted-dark:#9CA3BF;--rule:#DDD8EC;--rule-dark:#2A2F4A;--arc:#4A4470;--white:#FFFFFF;--display:Outfit,'Trebuchet MS',sans-serif;--body:Onest,Arial,sans-serif;--code:'JetBrains Mono',Consolas,monospace}
text{font-family:var(--body);fill:var(--night);font-size:16px} .head,.button{font-family:var(--display);font-weight:500;letter-spacing:-.03em}.muted{fill:var(--muted)}.light{fill:var(--cloud)}.lavender{fill:var(--lavender)}.night-muted{fill:var(--muted-dark)}.mono{font-family:var(--code)}
@font-face{font-family:'Onest';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Outfit';font-style:normal;font-weight:500;src:url(data:font/woff;base64,) format('woff')}</style><defs><clipPath id="solution-production-clip"><rect width="600" height="856" rx="16"/></clipPath></defs>
