<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="view-client-title view-client-desc">
<title id="view-client-title">Atlas client portal</title><desc id="view-client-desc">16:9 sample portal for Morgan. Top tabs, a midnight Atlas project card and attention rows for Final presentation v3 and an invoice. No internal comments or agency margin data.</desc>
<style>:root{--night:#101326;--raised:#171B33;--well:#1F2440;--cloud:#F8FAFC;--paper:#F1EEF8;--soft:#E6E1F4;--lavender:#C4B5FD;--violet:#8B5CF6;--accent:#7C3AED;--muted:#5B6478;--muted-dark:#9CA3BF;--rule:#DDD8EC;--rule-dark:#2A2F4A;--arc:#4A4470;--white:#FFFFFF;--display:Outfit,'Trebuchet MS',sans-serif;--body:Onest,Arial,sans-serif;--code:'JetBrains Mono',Consolas,monospace}
text{font-family:var(--body);fill:var(--night);font-size:16px} .head,.button{font-family:var(--display);font-weight:500;letter-spacing:-.03em}.muted{fill:var(--muted)}.light{fill:var(--cloud)}.lavender{fill:var(--lavender)}.night-muted{fill:var(--muted-dark)}.mono{font-family:var(--code)}
@font-face{font-family:'Onest';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Outfit';font-style:normal;font-weight:500;src:url(data:font/woff;base64,) format('woff')}</style><defs><clipPath id="view-client-clip"><rect width="1440" height="810" rx="16"/></clipPath></defs>
<g clip-path="url(#view-client-clip)"><rect x="0" y="0" width="1440" height="810" rx="16" fill="var(--cloud)"/><g transform="translate(40 24) scale(1)" fill="none" stroke="var(--accent)" stroke-width="1.5"><circle cx="20" cy="20" r="17"/><circle cx="20" cy="20" r="10"/><circle cx="34" cy="10" r="4" fill="var(--violet)" stroke="none"/></g><text x="94" y="53" class="head" style="font-size:24px">Northstar Studio</text><text x="1234" y="49" class="muted" style="font-size:16px">Morgan / Atlas</text><path d="M40 82H1400" fill="none" stroke="var(--rule)"/><text x="40" y="124" class="head" style="font-size:18px;fill:var(--accent)">overview</text><text x="180" y="124" class="head" style="font-size:18px;fill:var(--muted)">reviews</text><text x="302" y="124" class="head" style="font-size:18px;fill:var(--muted)">files</text><text x="396" y="124" class="head" style="font-size:18px;fill:var(--muted)">invoices</text><rect x="1260" y="100" width="140" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="1330.0" y="121" class="button" style="font-size:14px;fill:var(--night)">sample data</text><text x="40" y="204" class="head" style="font-size:42px">welcome back, Morgan</text><rect x="40" y="242" width="1360" height="190" rx="16" fill="var(--night)"/><text x="72" y="294" class="head" style="font-size:32px;fill:var(--cloud)">atlas brand identity</text><text x="72" y="336" class="" style="font-size:18px;fill:var(--lavender)">Next milestone: final handover / 09 Nov 2026</text><text x="72" y="391" class="" style="font-size:16px;fill:var(--cloud)">3 of 4 milestones complete</text><rect x="850" y="366" width="500" height="8" rx="4" fill="var(--arc)"/><rect x="850" y="366" width="375" height="8" rx="4" fill="var(--lavender)"/><text x="40" y="492" class="head" style="font-size:28px">needs your attention</text><text x="40" y="548" class="head" style="font-size:21px">Final presentation v3</text><text x="40" y="579" class="muted" style="font-size:16px">Ready for your review</text><rect x="1220" y="523" width="180" height="48" rx="24" fill="var(--accent)"/><text text-anchor="middle" x="1310.0" y="553" class="button" style="font-size:16px;fill:var(--white)">review</text><path d="M40 602H1400" fill="none" stroke="var(--rule)"/><text x="40" y="656" class="head" style="font-size:21px">Invoice INV-2026-041</text><text x="40" y="687" class="muted" style="font-size:16px">CAD 1,200.00 / due 16 Nov 2026</text><rect x="1220" y="631" width="180" height="48" rx="24" fill="var(--accent)"/><text text-anchor="middle" x="1310.0" y="661" class="button" style="font-size:16px;fill:var(--white)">view invoice</text><path d="M40 710H1400" fill="none" stroke="var(--rule)"/><text x="40" y="777" class="muted" style="font-size:14px">Northstar Studio is fictional. Every number is sample data.</text></g></svg>