<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="view-phone-title view-phone-desc">
<title id="view-phone-title">Orbit on the go</title><desc id="view-phone-desc">390 by 844 mobile screen without a device bezel. Two-column sample KPI tiles, today’s priority checklist and bottom navigation. Rounded 16 pixel screen corners.</desc>
<style>:root{--night:#101326;--raised:#171B33;--well:#1F2440;--cloud:#F8FAFC;--paper:#F1EEF8;--soft:#E6E1F4;--lavender:#C4B5FD;--violet:#8B5CF6;--accent:#7C3AED;--muted:#5B6478;--muted-dark:#9CA3BF;--rule:#DDD8EC;--rule-dark:#2A2F4A;--arc:#4A4470;--white:#FFFFFF;--display:Outfit,'Trebuchet MS',sans-serif;--body:Onest,Arial,sans-serif;--code:'JetBrains Mono',Consolas,monospace}
text{font-family:var(--body);fill:var(--night);font-size:16px} .head,.button{font-family:var(--display);font-weight:500;letter-spacing:-.03em}.muted{fill:var(--muted)}.light{fill:var(--cloud)}.lavender{fill:var(--lavender)}.night-muted{fill:var(--muted-dark)}.mono{font-family:var(--code)}
@font-face{font-family:'Onest';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Outfit';font-style:normal;font-weight:500;src:url(data:font/woff;base64,) format('woff')}</style><defs><clipPath id="view-phone-clip"><rect width="390" height="844" rx="16"/></clipPath></defs>
<g clip-path="url(#view-phone-clip)"><rect x="0" y="0" width="390" height="844" rx="16" fill="var(--cloud)"/><text x="24" y="42" class="head" style="font-size:20px">Northstar Studio</text><rect x="242" y="20" width="124" height="32" rx="16" fill="var(--soft)"/><text text-anchor="middle" x="304.0" y="41" class="button" style="font-size:14px;fill:var(--night)">sample data</text><text x="24" y="102" class="head" style="font-size:32px">morning, Alex</text><text x="24" y="136" class="muted" style="font-size:16px">Monday, 9 November</text><rect x="24" y="164" width="163" height="104" rx="16" fill="var(--paper)"/><text x="40" y="207" class="head" style="font-size:34px">4</text><text x="40" y="241" class="muted" style="font-size:14px">Active projects</text><rect x="203" y="164" width="163" height="104" rx="16" fill="var(--paper)"/><text x="219" y="207" class="head" style="font-size:34px">84%</text><text x="219" y="241" class="muted" style="font-size:14px">Tasks done / due</text><rect x="24" y="284" width="163" height="104" rx="16" fill="var(--paper)"/><text x="40" y="327" class="head" style="font-size:34px">6</text><text x="40" y="361" class="muted" style="font-size:14px">Waiting on clients</text><rect x="203" y="284" width="163" height="104" rx="16" fill="var(--paper)"/><text x="219" y="327" class="head" style="font-size:34px">3</text><text x="219" y="361" class="muted" style="font-size:14px">Unpaid invoices</text><text x="24" y="438" class="head" style="font-size:25px">today’s priorities</text><rect x="24" y="467" width="24" height="24" rx="12" fill="var(--accent)"/><path d="M30 479l4 4 8-9" fill="none" stroke="var(--white)" stroke-width="2"/><text x="62" y="484" class="head" style="font-size:17px">Send Atlas v3</text><text x="62" y="510" class="muted" style="font-size:14px">Jamie / Atlas</text><path d="M24 528H366" fill="none" stroke="var(--rule)"/><rect x="24" y="551" width="24" height="24" rx="12" fill="var(--soft)"/><text x="62" y="568" class="head" style="font-size:17px">Check final exports</text><text x="62" y="594" class="muted" style="font-size:14px">Riley / Atlas</text><path d="M24 612H366" fill="none" stroke="var(--rule)"/><rect x="24" y="635" width="24" height="24" rx="12" fill="var(--soft)"/><text x="62" y="652" class="head" style="font-size:17px">Prepare invoice draft</text><text x="62" y="678" class="muted" style="font-size:14px">Alex / Atlas</text><path d="M24 696H366" fill="none" stroke="var(--rule)"/><text x="24" y="742" class="muted" style="font-size:14px">Fictional workspace. Sample data.</text><path d="M0 774H390" fill="none" stroke="var(--rule)"/><text x="24" y="813" class="head" style="font-size:16px;fill:var(--accent)">home</text><text x="111" y="813" class="head" style="font-size:16px;fill:var(--muted)">projects</text><text x="215" y="813" class="head" style="font-size:16px;fill:var(--muted)">tasks</text><text x="303" y="813" class="head" style="font-size:16px;fill:var(--muted)">more</text></g></svg>